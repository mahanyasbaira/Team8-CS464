name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/dotnet --nologo

  analysis-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r analysis/requirements.txt
      - run: python -m pytest analysis -q
      - name: run pipeline on fake data
        run: |
          python analysis/fake_data.py --n 12 --out /tmp/fake
          python analysis/analyze.py --data /tmp/fake --out /tmp/results
          test -f /tmp/results/summary_by_condition.csv

  unity-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check ProjectVersion.txt matches .unity-version
        run: |
          pinned=$(tr -d '[:space:]' < .unity-version)
          f=ProjectSettings/ProjectVersion.txt
          if [ ! -f "$f" ]; then echo "no Unity project yet, skipping"; exit 0; fi
          actual=$(grep m_EditorVersion: "$f" | head -1 | awk '{print $2}')
          echo "pinned=$pinned actual=$actual"
          case "$actual" in
            "$pinned"*) echo ok ;;
            *) echo "Unity version changed to $actual. Update .unity-version on purpose or revert."; exit 1 ;;
          esac
